name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 and Node 24 ships an older one.
      - run: npm install -g npm@latest
      - run: bun test
      - name: Check tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          echo "tag=$tag package=$package"
          test "$tag" = "$package"
      # OIDC only: no long-lived npm token is stored. Configure the trusted
      # publisher on npmjs.com (repo + this workflow file) or the publish fails
      # with "403 OIDC permission denied".
      - name: Publish to npm
        run: npm publish --access public --provenance
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
